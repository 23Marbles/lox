[package]
name = "lox"
version = "0.1.0"
edition = "2024"

[features]
default = ["ast", "nicer_repl"]
ast = []
bytecode = []
challenges = ["implicit_helpers", "repl_expr_print", "inline_comments", "break"]
nicer_repl = ["repl_expr_print"] #, "implicit_semicolons"]
repl_expr_print = []
implicit_helpers = ["implicit_converions", "implicit_semicolons"]
implicit_converions = []
implicit_semicolons = []
inline_comments = []
break = []
class_challenges = ["static_methods", "getters_setters"]
static_methods = []
getters_setters = []
div_zero_error = []
nan_inf_consts = []

[dev-dependencies]
libtest-with = "0.8.1-14"
regex = "1.12.3"

[[test]]
name = "lox-tests"
path = "tests/runner.rs"

[[bench]]
name = "lox-bench"
path = "benches/runner.rs"
harness = false

[dependencies]
codespan-reporting = "0.13.1"
